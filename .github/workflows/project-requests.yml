name: Review incoming project requests
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  contents: write
  pull-requests: write
  issues: read
jobs:
  draft-spec:
    if: startsWith(github.event.issue.title, '[Project Request]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate intake script
        run: python -m unittest discover -s tests -p test_issue_to_spec.py -v
      - name: Generate request specification
        run: python scripts/issue_to_spec.py --event "$GITHUB_EVENT_PATH"
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/request-${{ github.event.issue.number }}
          delete-branch: true
          title: "Spec for project request #${{ github.event.issue.number }}"
          commit-message: "docs: draft project specification from issue #${{ github.event.issue.number }}"
          body: "Generated from a user-submitted request for review. This is a specification, not completed code. Do not merge without checking the scope and untrusted user input."
