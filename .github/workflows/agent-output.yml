name: Agent output validation
on:
  pull_request:
    paths:
      - 'projects/**'
      - 'scripts/agent_output_gate.py'
      - 'tests/test_agent_output_gate.py'
      - '.github/workflows/agent-output.yml'
  workflow_dispatch:
    inputs:
      project_slug:
        description: 'Existing project slug to validate (no code is generated)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run agent contract tests
        run: python -m unittest discover -s tests -p test_agent_output_gate.py -v
      - name: Validate selected project (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          SLUG: ${{ inputs.project_slug }}
        run: python scripts/agent_output_gate.py "$SLUG"
