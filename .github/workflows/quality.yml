name: Project quality gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Factory tests
        run: python -m unittest discover -s tests -v
      - name: Port Inspector parser tests
        run: python -m unittest discover -s projects/port-inspector/tests -v
      - name: Port Inspector CLI help
        run: python projects/port-inspector/port_inspector.py --help
